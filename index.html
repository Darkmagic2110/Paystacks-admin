<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Admin - Set Keys, Add Coins & View History</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600&display=swap" rel="stylesheet">

<style>
body {
    background: black;
    color: white;
    font-family: 'Poppins', sans-serif;
    text-align: center;
    padding: 20px;
}
h1 {
    font-size: 28px;
    color: red;
    margin-bottom: 20px;
}
input[type="text"], input[type="password"], input[type="number"] {
    width: 90%;
    padding: 12px;
    font-size: 16px;
    margin: 10px 0;
    border-radius: 8px;
    border: none;
}
button {
    width: 92%;
    padding: 14px;
    background: #e60000;
    font-size: 16px;
    color: #ffffff;
    font-weight: 600;
    border-radius: 10px;
    border: none;
    margin-top: 12px;
    cursor: pointer;
    letter-spacing: 0.5px;
    transition: 0.3s ease-in-out;
    box-shadow: 0 0 18px rgba(255, 0, 0, 0.7);
}
button:hover {
    box-shadow: 0 0 25px rgba(255, 0, 0, 1);
}
#approvePageBtn {
    background: #00b300;
}
#status {
    margin-top: 15px;
    font-size: 16px;
    color: yellow;
}
#historyBox {
    margin-top: 25px;
    text-align: left;
}
.history-item {
    background: #111;
    border-radius: 10px;
    padding: 12px;
    margin: 10px 0;
    display: flex;
    justify-content: space-between;
    font-family: 'Poppins', sans-serif;
}
.history-left { text-align: left; }
.history-right { text-align: right; }
.history-title { color: lime; }
.history-sub { font-size: 12px; color: #aaa; }
.history-naira { color: cyan; font-size: 13px; }
#toast {
    visibility: hidden;
    min-width: 240px;
    background-color: red;
    color: black;
    text-align: center;
    border-radius: 10px;
    padding: 12px;
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 16px;
    z-index: 9999;
    opacity: 0;
    transition: opacity 0.3s, bottom 0.3s;
}
#toast.show {
    visibility: visible;
    opacity: 1;
    bottom: 50px;
}
</style>
</head>
<body>

<h1>Admin Dashboard</h1>

<button id="approvePageBtn">✅ Approve Page</button>

<h1>Admin: Set Paystack Keys</h1>
<input type="text" id="publicKey" placeholder="Enter Paystack Public Key" />
<input type="password" id="secretKey" placeholder="Enter Paystack Secret Key" />
<button id="saveBtn">💾 Save Keys</button>

<!-- ✅ ADDED Flutterwave Section -->
<h1>Admin: Set Flutterwave Key</h1>
<input type="text" id="flutterPublicKey" placeholder="Enter Flutterwave Public Key (FLWPUBK-...)" />
<button id="saveFlutterBtn">💾 Save Flutterwave Key</button>

<hr style="margin:20px 0; border-color: #444;" />

<h1>Add Coins to User</h1>
<input type="text" id="userEmail" placeholder="Enter User Email" />
<input type="number" id="coinAmount" placeholder="Enter Amount" min="1" />
<button id="addCoinsBtn">💰 Add Coins</button>

<hr style="margin:20px 0; border-color: #444;" />

<h1>View User Transaction History</h1>
<input type="text" id="historyEmail" placeholder="Enter User Email" />
<button id="loadHistoryBtn">📜 Load History</button>

<div id="status"></div>

<div id="historyBox">
    <h3>Transactions</h3>
    <div id="historyList"></div>
</div>

<div id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>

const firebaseConfig = {
    apiKey: "AIzaSyDvFDByPPo9zgwKLdPaREz1OVMQCXmPfrs",
    authDomain: "bets-d795d.firebaseapp.com",
    projectId: "bets-d795d",
    storageBucket: "bets-d795d.appspot.com",
    messagingSenderId: "384386108287",
    appId: "1:384386108287:android:d238a5ec8068d9bb9be84a",
    databaseURL: "https://bets-d795d-default-rtdb.firebaseio.com"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

function toast(msg) {
    const t = document.getElementById("toast");
    t.innerHTML = msg;
    t.className = "show";
    setTimeout(() => {
        t.className = t.className.replace("show", "");
    }, 3000);
}

firebase.auth().onAuthStateChanged(user => {
    if (!user) {
        window.location.href = "login.html";
        return;
    }
});

document.getElementById("approvePageBtn").onclick = () => {
    window.location.href = "approve.html";
};

/* Paystack Save */

document.getElementById("saveBtn").onclick = () => {

    const publicKey =
        document.getElementById("publicKey").value.trim();

    const secretKey =
        document.getElementById("secretKey").value.trim();

    if (!publicKey || !secretKey)
        return toast("Both keys are required");

    db.ref("settings/paystackKeys")
    .set({
        public: publicKey,
        secret: secretKey
    })
    .then(() => {

        document.getElementById("status").innerHTML =
        "✅ Paystack keys saved successfully!";

        toast("Paystack keys updated");

    })
    .catch(err => {

        document.getElementById("status").innerHTML =
        "❌ Error saving Paystack keys";

        toast(err.message);

    });

};

/* ✅ Flutterwave Save (NEW) */

document.getElementById("saveFlutterBtn").onclick = () => {

    const flutterKey =
        document.getElementById("flutterPublicKey")
        .value.trim();

    if (!flutterKey)
        return toast("Enter Flutterwave public key");

    db.ref("settings/flutterwaveKeys")
    .set({
        public: flutterKey
    })
    .then(() => {

        document.getElementById("status").innerHTML =
        "✅ Flutterwave key saved successfully!";

        toast("Flutterwave key updated");

    })
    .catch(err => {

        document.getElementById("status").innerHTML =
        "❌ Error saving Flutterwave key";

        toast(err.message);

    });

};

/* (Your existing Add Coins and History code stays unchanged) */

</script>

</body>
</html>
