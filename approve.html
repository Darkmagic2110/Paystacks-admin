<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Withdrawals</title>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<style>
body{
    margin:0;
    padding:20px;
    background:#111;
    color:white;
    font-family:Arial,sans-serif;
}
h1{
    text-align:center;
}
.card{
    background:#1a1a1a;
    border:1px solid #333;
    border-radius:12px;
    padding:15px;
    margin-bottom:15px;
}
.section{
    margin-top:10px;
    padding-top:10px;
    border-top:1px solid #333;
}
.label{
    color:#00e5ff;
    font-weight:bold;
}
button{
    background:#00c853;
    color:white;
    border:none;
    padding:10px 15px;
    border-radius:8px;
    cursor:pointer;
    margin-top:10px;
}
button:hover{
    opacity:.9;
}
.status{
    font-weight:bold;
    color:#ffeb3b;
}
.search{
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    margin-bottom:20px;
}
</style>
</head>
<body>
<h1>Admin Withdrawal Dashboard</h1>

<input
type=“text”
id=“searchEmail”
class=“search”
placeholder=“Search by email…”

<div id="withdrawals"></div>
<script>
const firebaseConfig = {
    apiKey: "AIzaSyDvFDByPPo9zgwKLdPaREz1OVMQCXmPfrs",
    authDomain: "bets-d795d.firebaseapp.com",
    databaseURL: "https://bets-d795d-default-rtdb.firebaseio.com",
    projectId: "bets-d795d",
    storageBucket: "bets-d795d.appspot.com",
    messagingSenderId: "384386108287",
    appId: "1:384386108287:android:d238a5ec8068d9bb9be84a"
};
if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
}
const db = firebase.database();
let allWithdrawals = [];
loadWithdrawals();
document.getElementById("searchEmail")
.addEventListener("input", renderWithdrawals);
function loadWithdrawals(){
    db.ref("withdrawals").on("value", async(snapshot)=>{
        allWithdrawals = [];
        const promises = [];
        snapshot.forEach(child=>{
            const withdrawal = {
                id: child.key,
                ...child.val()
            };
            const p = db.ref("users/" + withdrawal.userId)
            .once("value")
            .then(userSnap=>{
                withdrawal.user = userSnap.val() || {};
                allWithdrawals.push(withdrawal);
            });
            promises.push(p);
        });
        await Promise.all(promises);
        allWithdrawals.sort((a,b)=>
            (b.time || 0) - (a.time || 0)
        );
        renderWithdrawals();
    });
}
function renderWithdrawals(){
    const container = document.getElementById("withdrawals");
    const keyword = document
        .getElementById("searchEmail")
        .value
        .toLowerCase();
    container.innerHTML = "";
    allWithdrawals.forEach(w=>{
        const email = (w.email || "").toLowerCase();
        if(keyword && !email.includes(keyword)){
            return;
        }
        const user = w.user || {};
        const date = w.time
            ? new Date(w.time).toLocaleString()
            : "N/A";
        container.innerHTML += `
        <div class="card">
            <h3>Withdrawal Request</h3>
            <div>
                <span class="label">Withdrawal ID:</span>
                ${w.id}
            </div>
            <div>
                <span class="label">Email:</span>
                ${w.email || "N/A"}
            </div>
            <div>
                <span class="label">User UID:</span>
                ${w.userId || "N/A"}
            </div>
            <div>
                <span class="label">Amount:</span>
                ₦${w.amount || 0}
            </div>
            <div>
                <span class="label">Bank:</span>
                ${w.bank || "N/A"}
            </div>
            <div>
                <span class="label">Account Number:</span>
                ${w.accNum || "N/A"}
            </div>
            <div>
                <span class="label">Account Name:</span>
                ${w.accName || "N/A"}
            </div>
            <div>
                <span class="label">Status:</span>
                <span class="status">
                    ${w.status || "pending"}
                </span>
            </div>
            <div>
                <span class="label">Date:</span>
                ${date}
            </div>
            <div class="section">
                <h3>User Information</h3>
                <div>
                    <span class="label">Name:</span>
                    ${user.name || "N/A"}
                </div>
                <div>
                    <span class="label">Email:</span>
                    ${user.email || w.email || "N/A"}
                </div>
                <div>
                    <span class="label">Referral Code:</span>
                    ${user.refCode || "N/A"}
                </div>
                <div>
                    <span class="label">Referred By:</span>
                    ${user.referredBy || "N/A"}
                </div>
                <div>
                    <span class="label">Affiliate Balance:</span>
                    ₦${Number(user.affiliateBalance || 0).toFixed(2)}
                </div>
                <div>
                    <span class="label">Total Earned:</span>
                    ₦${Number(user.totalEarned || 0).toFixed(2)}
                </div>
            </div>
            <button onclick="markPaid('${w.id}')">
                Mark As Paid
            </button>
        </div>
        `;
    });
}
function markPaid(id){
    db.ref("withdrawals/" + id + "/status")
    .set("paid")
    .then(()=>{
        alert("Withdrawal marked as paid");
    })
    .catch(err=>{
        alert(err.message);
    });
}
</script>
</body>
</html>
