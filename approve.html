<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Referral Panel</title>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>
body {
    margin:0;
    font-family:'Poppins',sans-serif;
    background:#0a0a0a;
    color:white;
    padding:20px;
}

.container { max-width:500px; margin:auto; }

h1 { text-align:center; color:red; }

.card {
    background:#111;
    padding:15px;
    border-radius:12px;
    margin-bottom:15px;
    border:1px solid #222;
}

input {
    width:100%;
    padding:12px;
    margin:6px 0;
    border-radius:8px;
    border:none;
    background:#1a1a1a;
    color:white;
}

button {
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    background:red;
    color:white;
    font-weight:bold;
    cursor:pointer;
    margin-top:8px;
}

.stat {
    display:flex;
    justify-content:space-between;
    margin:6px 0;
}

.stat span:last-child {
    color:lime;
    font-weight:bold;
}

.userBox {
    background:#1a1a1a;
    padding:10px;
    border-radius:8px;
    margin-top:10px;
    font-size:13px;
}
</style>
</head>

<body>

<div class="container">

<h1>ADMIN PANEL</h1>

<div class="card">
    <h3>Search User</h3>
    <input id="emailInput" placeholder="Enter user email">
    <button onclick="searchUser()">Search</button>
</div>

<div class="card" id="result" style="display:none;">

    <h3>User Info</h3>

    <div class="stat"><span>Name</span><span id="name"></span></div>
    <div class="stat"><span>Email</span><span id="email"></span></div>
    <div class="stat"><span>Referral Code</span><span id="refCode"></span></div>

    <hr>

    <div class="stat"><span>Total Referrals</span><span id="totalRef"></span></div>
    <div class="stat"><span>Affiliate Balance</span><span id="balance"></span></div>
    <div class="stat"><span>Total Earned</span><span id="earned"></span></div>

    <hr>

    <h3>Add Money</h3>
    <input id="amount" placeholder="Enter amount">

    <button onclick="addMoney()">Add to Affiliate</button>

</div>

</div>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyDvFDByPPo9zgwKLdPaREz1OVMQCXmPfrs",
    authDomain: "bets-d795d.firebaseapp.com",
    databaseURL: "https://bets-d795d-default-rtdb.firebaseio.com",
    projectId: "bets-d795d",
    storageBucket: "bets-d795d.appspot.com",
    messagingSenderId: "384386108287",
    appId: "1:384386108287:android:d238a5ec8068d9bb9be84a"
};

if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let userUID = null;
let refCode = null;
let withdrawData = {};

/* ================= LOGIN ================= */
firebase.auth().onAuthStateChanged(user => {
    if (!user) return window.location.href = "login.html";

    userUID = user.uid;

    db.ref("users/" + userUID).once("value").then(snap => {
        const data = snap.val() || {};
        refCode = data.refCode || "";

        document.getElementById("refLink").innerText =
            window.location.origin + "/index.html?ref=" + refCode;

        loadDashboard();
        loadWithdrawals(); // 🔥 NEW
    });
});

/* ================= DASHBOARD ================= */
function loadDashboard() {

    db.ref("users/" + userUID + "/affiliateBalance").on("value", snap => {
        document.getElementById("balance").innerText =
            "₦" + (snap.val() || 0).toFixed(2);
    });

    db.ref("users/" + userUID + "/totalEarned").on("value", snap => {
        document.getElementById("totalEarned").innerText =
            "₦" + (snap.val() || 0).toFixed(2);
    });

    db.ref("users").once("value").then(snap => {
        let count = 0;
        let list = [];

        snap.forEach(child => {
            const u = child.val() || {};
            if (u.referredBy === refCode) {
                count++;
                list.push(u);
            }
        });

        document.getElementById("totalRef").innerText = count;
        window.referredUsers = list;
    });
}

/* ================= WITHDRAWALS (NEW ADMIN VIEW) ================= */
function loadWithdrawals() {
    const box = document.getElementById("withdrawList");

    db.ref("withdrawals").on("value", snap => {
        box.innerHTML = "";

        let data = [];

        snap.forEach(child => {
            data.push(child.val());
        });

        data.reverse().forEach(w => {

            const date = w.time ? new Date(w.time).toLocaleString() : "N/A";

            box.innerHTML += `
                <div class="card" style="border-left:4px solid red;">
                    <b>${w.email || "No Email"}</b><br><br>

                    Amount: ₦${w.amount}<br>
                    Bank: ${w.bank}<br>
                    Account No: ${w.accNum}<br>
                    Account Name: ${w.accName}<br>
                    Status: <b>${w.status}</b><br>
                    Time: ${date}
                </div>
            `;
        });
    });
}

/* ================= COPY ================= */
function copyLink() {
    navigator.clipboard.writeText(document.getElementById("refLink").innerText);
    alert("Copied!");
}

/* ================= USERS TOGGLE ================= */
function toggleUsers() {
    const box = document.getElementById("userList");
    const btn = event.target;

    if (box.style.display === "none") {
        box.innerHTML = "";

        (window.referredUsers || []).forEach(u => {
            box.innerHTML += `
                <div class="user">
                    <b>${u.name}</b><br>
                    ${u.email}
                </div>
            `;
        });

        box.style.display = "block";
        btn.innerText = "Hide Referred Emails";
    } else {
        box.style.display = "none";
        btn.innerText = "Show Referred Emails";
    }
}

/* ================= WITHDRAW FLOW ================= */
function withdraw() {
    db.ref("users/" + userUID + "/affiliateBalance").once("value").then(snap => {
        const bal = snap.val() || 0;

        if (bal < 5000) {
            alert("Minimum withdrawal is ₦5,000");
            return;
        }

        document.getElementById("withdrawModal").style.display = "flex";
    });
}

function closeWithdraw() {
    document.getElementById("withdrawModal").style.display = "none";
}

function submitWithdraw() {
    const amount = Number(document.getElementById("withdrawAmount").value);
    const bank = document.getElementById("bankName").value;
    const accNum = document.getElementById("accNumber").value;
    const accName = document.getElementById("accName").value;

    if (!amount || amount < 5000) {
        alert("Minimum ₦5,000");
        return;
    }

    db.ref("users/" + userUID + "/affiliateBalance")
        .transaction(v => (v || 0) - amount);

    withdrawData = { amount, bank, accNum, accName };

    document.getElementById("withdrawModal").style.display = "none";
    document.getElementById("confirmModal").style.display = "flex";
}

function closeConfirm() {
    document.getElementById("confirmModal").style.display = "none";
}

/* ================= CONFIRM ================= */
function copyAndRedirect() {
    const email = firebase.auth().currentUser.email;

    const text =
`I have a pending withdrawal
Email: ${email}
Amount: ₦${withdrawData.amount}
Bank: ${withdrawData.bank}
Account: ${withdrawData.accNum}
Name: ${withdrawData.accName}`;

    navigator.clipboard.writeText(text);

    db.ref("withdrawals").push({
        userId: userUID,
        email,
        ...withdrawData,
        time: Date.now(),
        status: "instant"
    });

    window.location.href = "https://t.me/darkmagic01";
}
</script>

</body>
</html>
