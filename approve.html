<!DOCTYPE html>
<html>
<head>
    <title>Admin Withdrawal Control</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

    <style>
        body {
            font-family: Arial;
            background: #0f172a;
            color: white;
            text-align: center;
            padding: 30px;
        }

        .card {
            background: #1e293b;
            padding: 20px;
            border-radius: 10px;
            width: 300px;
            margin: auto;
        }

        button {
            padding: 12px;
            margin: 10px;
            width: 100%;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .open {
            background: #22c55e;
            color: white;
        }

        .close {
            background: #ef4444;
            color: white;
        }

        .status {
            margin: 15px 0;
            font-size: 18px;
        }
    </style>
</head>

<body>

<h2>Withdrawal Admin Panel</h2>

<div class="card">
    <div class="status">
        Status: <span id="statusText">Loading...</span>
    </div>

    <button class="open" onclick="openWithdraw()">OPEN WITHDRAWAL</button>
    <button class="close" onclick="closeWithdraw()">BLOCK WITHDRAWAL</button>
</div>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyDvFDByPPo9zgwKLdPaREz1OVMQCXmPfrs",
    authDomain: "bets-d795d.firebaseapp.com",
    databaseURL: "https://bets-d795d-default-rtdb.firebaseio.com",
    projectId: "bets-d795d",
    storageBucket: "bets-d795d.appspot.com",
    messagingSenderId: "384386108287",
    appId: "1:384386108287:android:d238a5ec8068d9bb9be84a"
};

if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const db = firebase.database();

/* LIVE STATUS */
db.ref("settings/withdrawal/enabled").on("value", snap => {
    const val = snap.val();

    if (val === false) {
        document.getElementById("statusText").innerText = "BLOCKED ❌";
        document.getElementById("statusText").style.color = "red";
    } else {
        document.getElementById("statusText").innerText = "OPEN ✅";
        document.getElementById("statusText").style.color = "lime";
    }
});

/* OPEN WITHDRAWAL */
function openWithdraw() {
    db.ref("settings/withdrawal/enabled").set(true);
    alert("Withdrawal OPENED");
}

/* BLOCK WITHDRAWAL */
function closeWithdraw() {
    db.ref("settings/withdrawal/enabled").set(false);
    alert("Withdrawal BLOCKED");
}
</script>

</body>
</html>
