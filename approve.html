<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin Withdrawals</title>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<style>
body{
    background:#111;
    color:#fff;
    font-family:Arial;
    padding:20px;
}

.card{
    background:#1c1c1c;
    border:1px solid #333;
    padding:15px;
    margin-bottom:10px;
    border-radius:10px;
}

input{
    width:100%;
    padding:10px;
    margin-bottom:15px;
}
button{
    padding:10px;
    margin-top:10px;
    background:green;
    border:none;
    color:white;
    cursor:pointer;
}
</style>
</head>

<body>

<h2>Withdrawals Admin Panel</h2>

<input id="search" placeholder="Search email...">

<div id="list"></div>

<script>

const firebaseConfig = {
    apiKey: "AIzaSyDvFDByPPo9zgwKLdPaREz1OVMQCXmPfrs",
    authDomain: "bets-d795d.firebaseapp.com",
    databaseURL: "https://bets-d795d-default-rtdb.firebaseio.com",
    projectId: "bets-d795d",
    storageBucket: "bets-d795d.appspot.com",
    messagingSenderId: "384386108287",
    appId: "1:384386108287:android:d238a5ec8068d9bb9be84a"
};

if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);

const db = firebase.database();

let withdrawals = [];

db.ref("withdrawals").on("child_added", async snap => {

    let w = snap.val();
    w.id = snap.key;

    // get user info
    let user = {};
    if (w.userId) {
        const uSnap = await db.ref("users/" + w.userId).once("value");
        user = uSnap.val() || {};
    }

    w.user = user;

    withdrawals.unshift(w);

    render();
});

function render(){

    const q = document.getElementById("search").value.toLowerCase();
    const box = document.getElementById("list");

    box.innerHTML = "";

    withdrawals.forEach(w => {

        if(q && !(w.email || "").toLowerCase().includes(q)) return;

        box.innerHTML += `
        <div class="card">
            <b>Email:</b> ${w.email}<br>
            <b>Amount:</b> ₦${w.amount}<br>
            <b>Bank:</b> ${w.bank}<br>
            <b>Acc:</b> ${w.accNum}<br>
            <b>Name:</b> ${w.accName}<br>
            <b>Status:</b> ${w.status}<br>

            <hr>

            <b>User Name:</b> ${w.user.name || "N/A"}<br>
            <b>Referral:</b> ${w.user.refCode || "N/A"}<br>
            <b>Balance:</b> ₦${w.user.affiliateBalance || 0}<br>

            <button onclick="markPaid('${w.id}')">Mark Paid</button>
        </div>
        `;
    });
}

function markPaid(id){
    db.ref("withdrawals/" + id + "/status").set("paid");
    alert("Updated!");
}

document.getElementById("search").oninput = render;

</script>

</body>
</html>
