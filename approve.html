<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Referral Panel</title>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>
body {
    margin:0;
    font-family:'Poppins',sans-serif;
    background:#0a0a0a;
    color:white;
    padding:20px;
}

.container { max-width:500px; margin:auto; }

h1 { text-align:center; color:red; }

.card {
    background:#111;
    padding:15px;
    border-radius:12px;
    margin-bottom:15px;
    border:1px solid #222;
}

input {
    width:100%;
    padding:12px;
    margin:6px 0;
    border-radius:8px;
    border:none;
    background:#1a1a1a;
    color:white;
}

button {
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    background:red;
    color:white;
    font-weight:bold;
    cursor:pointer;
    margin-top:8px;
}

.stat {
    display:flex;
    justify-content:space-between;
    margin:6px 0;
}

.stat span:last-child {
    color:lime;
    font-weight:bold;
}

.userBox {
    background:#1a1a1a;
    padding:10px;
    border-radius:8px;
    margin-top:10px;
    font-size:13px;
}
</style>
</head>

<body>

<div class="container">

<h1>ADMIN PANEL</h1>

<div class="card">
    <h3>Search User</h3>
    <input id="emailInput" placeholder="Enter user email">
    <button onclick="searchUser()">Search</button>
</div>

<div class="card" id="result" style="display:none;">

    <h3>User Info</h3>

    <div class="stat"><span>Name</span><span id="name"></span></div>
    <div class="stat"><span>Email</span><span id="email"></span></div>
    <div class="stat"><span>Referral Code</span><span id="refCode"></span></div>

    <hr>

    <div class="stat"><span>Total Referrals</span><span id="totalRef"></span></div>
    <div class="stat"><span>Affiliate Balance</span><span id="balance"></span></div>
    <div class="stat"><span>Total Earned</span><span id="earned"></span></div>

    <hr>

    <h3>Add Money</h3>
    <input id="amount" placeholder="Enter amount">

    <button onclick="addMoney()">Add to Affiliate</button>

</div>

</div>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyDvFDByPPo9zgwKLdPaREz1OVMQCXmPfrs",
    authDomain: "bets-d795d.firebaseapp.com",
    databaseURL: "https://bets-d795d-default-rtdb.firebaseio.com",
    projectId: "bets-d795d",
    storageBucket: "bets-d795d.appspot.com",
    messagingSenderId: "384386108287",
    appId: "1:384386108287:android:d238a5ec8068d9bb9be84a"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let foundUID = null;

/* ================= SEARCH USER ================= */
function searchUser() {

    const email = document.getElementById("emailInput").value.trim().toLowerCase();

    db.ref("users").once("value").then(snap => {

        foundUID = null;

        snap.forEach(child => {
            const u = child.val();

            if (u.email === email) {
                foundUID = child.key;

                document.getElementById("name").innerText = u.name || "";
                document.getElementById("email").innerText = u.email || "";
                document.getElementById("refCode").innerText = u.refCode || "";

                // balances
                document.getElementById("balance").innerText =
                    "₦" + ((u.affiliate && u.affiliate.availableBalance) || 0);

                document.getElementById("earned").innerText =
                    "₦" + ((u.affiliate && u.affiliate.totalEarned) || 0);

                // referrals count
                let count = 0;

                snap.forEach(x => {
                    const d = x.val();
                    if (d.referredBy === u.refCode) count++;
                });

                document.getElementById("totalRef").innerText = count;

                document.getElementById("result").style.display = "block";
            }
        });

        if (!foundUID) {
            alert("User not found");
        }
    });
}

/* ================= ADD MONEY ================= */
function addMoney() {

    const amount = Number(document.getElementById("amount").value);

    if (!foundUID) return alert("Search user first");
    if (!amount) return alert("Enter amount");

    const userRef = db.ref("users/" + foundUID);

    // update BOTH balance + earned
    userRef.child("affiliate/availableBalance").transaction(v => (v || 0) + amount);
    userRef.child("affiliate/totalEarned").transaction(v => (v || 0) + amount);

    alert("Money added successfully ✔");
}
</script>

</body>
</html>
